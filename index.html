<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>بوابة الاستعلام عن طلبات المواطنين</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: #f2f5f9;
      color: #263445;
      direction: rtl;
    }

    .container {
      max-width: 760px;
      margin: 35px auto;
    }

    .header {
      background: linear-gradient(135deg, #123b5d, #176b78);
      color: white;
      text-align: center;
      padding: 35px 20px;
      border-radius: 18px 18px 0 0;
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: 25px;
      line-height: 1.6;
    }

    .header p {
      margin: 5px 0;
      font-size: 15px;
      line-height: 1.8;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .notice {
      background: #eef6fa;
      border-right: 4px solid #176b78;
      padding: 13px;
      margin-bottom: 25px;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.9;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d5dce5;
      border-radius: 9px;
      font-size: 17px;
      outline: none;
      direction: rtl;
      text-align: right;
    }

    input:focus {
      border-color: #176b78;
      box-shadow: 0 0 0 3px rgba(23,107,120,.12);
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 9px;
      background: #176b78;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #123b5d;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.8;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #a32626;
      border: 1px solid #f0cccc;
    }

    #message.success {
      display: block;
      background: #edf8f0;
      color: #176337;
      border: 1px solid #c9e7d0;
    }

    .result-card {
      margin-top: 25px;
    }

    .result-title {
      background: #123b5d;
      color: white;
      padding: 15px;
      border-radius: 9px 9px 0 0;
      font-weight: bold;
      font-size: 18px;
    }

    .result-row {
      padding: 15px;
      border: 1px solid #e4e9ef;
      border-top: none;
      line-height: 1.9;
      background: white;
    }

    .result-row:nth-child(even) {
      background: #f7f9fb;
    }

    .result-label {
      display: block;
      color: #176b78;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .result-value {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .footer {
      text-align: center;
      color: #778391;
      margin-top: 25px;
      font-size: 13px;
      line-height: 1.9;
    }

    @media(max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        margin: 10px auto;
      }

      .header {
        padding: 25px 15px;
      }

      .header h1 {
        font-size: 21px;
      }

      .card {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>بوابة الاستعلام عن طلبات المواطنين</h1>
      <p>النائب / ماجد ربيع عطوه</p>
      <p>خدمة إلكترونية لمتابعة موقف الطلبات</p>
    </div>

    <div class="card">

      <div class="notice">
        مرحباً بك في بوابة الاستعلام.
        اكتب اسمك كما ورد في الطلب (ثلاثي أو رباعي)
        لمعرفة آخر موقف للطلب والإجراءات التي تم اتخاذها.
      </div>

      <form id="searchForm">

        <div class="field">
          <label for="name">اسم مقدم الطلب</label>

          <input
            type="text"
            id="name"
            placeholder="اكتب الاسم الثلاثي أو الرباعي"
            maxlength="80"
            autocomplete="off"
            required
          >
        </div>

        <button type="submit" id="searchButton">
          استعلام عن الطلب
        </button>

      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <div id="results"></div>

    </div>

    <div class="footer">
      بوابة إلكترونية للاستعلام عن طلبات المواطنين
      <br>
      جميع الحقوق محفوظة
    </div>

  </div>

  <script>

    // رابط تطبيق الويب المنشور من Apps Script (ينتهي بـ /exec).
    const API_URL = 'https://script.google.com/macros/s/AKfycbz8_EoZXNFNKBr_Oanu9agjB-_dqRWWFdDAWY3EPPOUEgnCdsmQdP0x6Atp2KqzrNng/exec';

    const form = document.getElementById('searchForm');
    const button = document.getElementById('searchButton');
    const message = document.getElementById('message');
    const results = document.getElementById('results');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function makeRow(label, value) {
      const row = document.createElement('div');
      row.className = 'result-row';

      const l = document.createElement('span');
      l.className = 'result-label';
      l.textContent = label;

      const v = document.createElement('div');
      v.className = 'result-value';
      v.textContent = value;

      row.appendChild(l);
      row.appendChild(v);
      return row;
    }

    function renderResults(items) {
      results.textContent = '';

      items.forEach(function(item) {
        const card = document.createElement('div');
        card.className = 'result-card';

        const title = document.createElement('div');
        title.className = 'result-title';
        title.textContent = 'تفاصيل الطلب رقم ' + item.serial;
        card.appendChild(title);

        card.appendChild(makeRow('موضوع الطلب', item.topic));
        card.appendChild(makeRow('تأشيرة السيد الوزير المحافظ', item.visa));
        card.appendChild(makeRow('تاريخ الطلب', item.date));
        card.appendChild(makeRow('ما تم اتخاذه من إجراءات', item.action));

        results.appendChild(card);
      });
    }

    function done() {
      button.disabled = false;
      button.textContent = 'استعلام عن الطلب';
    }

    form.addEventListener('submit', function(event) {

      event.preventDefault();

      const name = document.getElementById('name').value.trim();

      if (!name) {
        showMessage('يرجى كتابة الاسم.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'جارٍ البحث عن الطلب...';

      message.className = '';
      message.textContent = '';
      results.textContent = '';

      fetch(API_URL + '?name=' + encodeURIComponent(name))

        .then(function(res) { return res.json(); })

        .then(function(response) {

          done();

          if (!response || !response.ok) {
            showMessage(
              response && response.message
                ? response.message
                : 'تعذر الحصول على نتيجة الاستعلام.',
              'error'
            );
            return;
          }

          renderResults(response.results);
          showMessage('تم العثور على ' + response.results.length +
            (response.results.length === 1 ? ' طلب.' : ' طلبات.'), 'success');

        })

        .catch(function(error) {

          done();

          showMessage(
            'حدث خطأ أثناء الاتصال بالنظام. يرجى المحاولة مرة أخرى.',
            'error'
          );

          console.error(error);

        });

    });

  </script>

</body>
</html>
